<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="view-transition" content="same-origin">
    <title>关节欧拉角实时监测</title>
    <link rel="stylesheet" href="css/common.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/arm.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <header>
        <a class="back-button" href="index.html">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>
        <h2 class="neon-text"><i class="fas fa-wave-square"></i> 关节欧拉角实时监测 <i class="fas fa-wave-square"></i></h2>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="frame-count">0</div>
            <div class="stat-label">帧数</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="data-rate">0</div>
            <div class="stat-label">数据速率 (Hz)</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="joint-count">4</div>
            <div class="stat-label">监测关节</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="channel-count">12</div>
            <div class="stat-label">数据通道</div>
        </div>
    </div>

    <div class="chart-grid">
        <!-- 右大臂 -->
        <div class="chart-card cyber-card">
            <div class="chart-header">
                <div class="chart-title">
                    <i class="fas fa-arm"></i> 右大臂欧拉角
                </div>
                <div class="chart-actions">
                    <button id="reset-right-upper">重置视图</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="chart_right_upper"></canvas>
            </div>
        </div>

        <!-- 右小臂 -->
        <div class="chart-card cyber-card">
            <div class="chart-header">
                <div class="chart-title">
                    <i class="fas fa-hand"></i> 右小臂欧拉角
                </div>
                <div class="chart-actions">
                    <button id="reset-right-lower">重置视图</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="chart_right_lower"></canvas>
            </div>
        </div>

        <!-- 左大臂 -->
        <div class="chart-card cyber-card">
            <div class="chart-header">
                <div class="chart-title">
                    <i class="fas fa-arm"></i> 左大臂欧拉角
                </div>
                <div class="chart-actions">
                    <button id="reset-left-upper">重置视图</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="chart_left_upper"></canvas>
            </div>
        </div>

        <!-- 左小臂 -->
        <div class="chart-card cyber-card">
            <div class="chart-header">
                <div class="chart-title">
                    <i class="fas fa-hand"></i> 左小臂欧拉角
                </div>
                <div class="chart-actions">
                    <button id="reset-left-lower">重置视图</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="chart_left_lower"></canvas>
            </div>
        </div>
    </div>

    <footer>
        <p>关节运动监测系统 &copy; 2025 | 数据更新中</p>
        <div class="connection-status">
            <div class="status-dot" id="status-dot"></div>
            <div class="status-text" id="status-text">已连接</div>
        </div>
    </footer>
</div>
<script src="js/page-transition.js"></script>
<script src="js/particles.js"></script>
<script src="js/deviceConfig.js"></script>
<script src="js/arm.js"></script>
</body>
</html>
