<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>个人中心 - 运动数据分析平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/personalInformation.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00e5ff',
                        secondary: '#00ff88',
                        accent: '#ff6b6b',
                        dark: '#080c14',
                        light: '#e8ecf2',
                        success: '#00ff88',
                        warning: '#ffb800',
                        danger: '#ff6b6b',
                        info: '#8b95a8',
                        surface: '#0f141f',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark min-h-screen transition-colors duration-300 text-light">
    <!-- Header -->
    <header class="bg-surface/80 backdrop-blur-md border-b border-white/5 relative z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <button id="sidebarToggle" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <h1 class="text-xl font-bold font-display tracking-wide neon-text">个人中心</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <button class="bg-white/5 hover:bg-white/10 p-2 rounded-full transition-colors border border-white/5">
                        <i class="fa-solid fa-bell"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed left-0 top-0 h-full w-80 bg-surface shadow-lg z-40 overflow-y-auto custom-scrollbar border-r border-white/5">
        <div class="p-6 border-b border-white/5">
            <div class="flex items-center space-x-4">
                <img id="sidebarAvatar" src="img/rungirl.jpg" alt="头像" class="w-12 h-12 rounded-full object-cover border-2 border-primary/30 shadow-md">
                <div>
                    <h3 id="sidebarUserName" class="font-semibold font-display tracking-wide">管理员</h3>
                    <p class="text-sm text-info">运动数据分析师</p>
                </div>
            </div>
        </div>
        <nav class="p-4">
            <div class="space-y-2">
                <a href="index.html" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-lg transition-colors text-info hover:text-light">
                    <i class="fa-solid fa-house"></i><span>首页</span>
                </a>
                <a href="personalInformation.html" class="flex items-center space-x-3 p-3 bg-primary/10 text-primary rounded-lg border border-primary/10">
                    <i class="fa-solid fa-user"></i><span>个人中心</span>
                </a>
                <a href="#" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-lg transition-colors text-info hover:text-light">
                    <i class="fa-solid fa-chart-line"></i><span>数据分析</span>
                </a>
                <a href="#" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-lg transition-colors text-info hover:text-light">
                    <i class="fa-solid fa-gear"></i><span>系统设置</span>
                </a>
            </div>
        </nav>
    </div>
    <!-- Sidebar overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-60 z-30 hidden"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 pb-24">
        <div class="max-w-4xl mx-auto">
            <!-- Profile Card -->
            <div class="user-card cyber-card rounded-xl shadow-lg overflow-hidden mb-8 slide-up">
                <div class="p-6">
                    <div class="flex flex-col md:flex-row items-center md:items-start space-y-4 md:space-y-0 md:space-x-6">
                        <div class="relative">
                            <img id="userAvatar" src="img/rungirl.jpg" alt="用户头像" class="w-24 h-24 rounded-full object-cover border-4 border-white/10 shadow-lg">
                            <button id="avatarUploadBtn" class="absolute bottom-0 right-0 bg-surface text-primary p-2 rounded-full shadow-lg hover:shadow-xl transition-all border border-primary/20">
                                <i class="fa-solid fa-camera text-sm"></i>
                            </button>
                        </div>
                        <div class="text-center md:text-left">
                            <h2 id="profileUserName" class="text-2xl font-bold mb-2 font-display tracking-wide">管理员</h2>
                            <p class="text-primary/80 mb-2">运动数据分析师</p>
                            <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm text-info">
                                <span class="flex items-center"><i class="fa-solid fa-calendar-days mr-1"></i><span id="profileAge">25岁</span></span>
                                <span class="flex items-center"><i class="fa-solid fa-user mr-1"></i><span id="profileGender">男</span></span>
                                <span class="flex items-center"><i class="fa-solid fa-ruler-vertical mr-1"></i><span id="profileHeight">175cm</span></span>
                                <span class="flex items-center"><i class="fa-solid fa-weight-scale mr-1"></i><span id="profileWeight">70kg</span></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white/5 backdrop-blur-sm p-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="text-center"><div class="text-2xl font-bold mb-1 font-display" id="profileHeightVal">175cm</div><div class="text-info text-sm">身高</div></div>
                        <div class="text-center"><div class="text-2xl font-bold mb-1 font-display" id="profileWeightVal">70kg</div><div class="text-info text-sm">体重</div></div>
                        <div class="text-center"><div id="profileBMI" class="text-2xl font-bold mb-1 font-display">22.9</div><div id="bmiStatus" class="text-xs font-semibold mb-1 text-accent-volt">正常</div><div class="text-info text-sm">BMI指数</div></div>
                    </div>
                    <div class="mt-4">
                        <div class="bmi-indicator mb-2"><div id="bmiMarker" class="bmi-marker" style="left:50%;"></div></div>
                        <div class="flex justify-between text-xs text-info"><span>过轻</span><span>正常</span><span>超重</span><span>肥胖</span></div>
                    </div>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="bg-surface rounded-xl shadow-lg p-6 mb-8 slide-up border border-white/5">
                <div class="section-header">
                    <div class="icon-box cyan"><i class="fa-solid fa-user-pen"></i></div>
                    <h3 class="text-xl font-bold font-display tracking-wide text-light">个人信息设置</h3>
                </div>
                <form id="profileForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="form-label">昵称</label>
                            <input type="text" id="nickname" class="form-input" placeholder="请输入昵称" value="管理员">
                        </div>
                        <div>
                            <label class="form-label">性别</label>
                            <select id="gender" class="form-select">
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">年龄</label>
                            <input type="number" id="age" class="form-input" placeholder="请输入年龄" value="25" min="1" max="120">
                        </div>
                        <div>
                            <label class="form-label">身高(cm)</label>
                            <input type="number" id="height" class="form-input" placeholder="请输入身高" value="175" min="100" max="250">
                        </div>
                        <div>
                            <label class="form-label">体重(kg)</label>
                            <input type="number" id="weight" class="form-input" placeholder="请输入体重" value="70" min="30" max="300" step="0.1">
                        </div>
                        <div>
                            <label class="form-label">大臂长(cm)</label>
                            <input type="number" id="upperArmLength" class="form-input" placeholder="请输入大臂长" value="30" min="15" max="50">
                        </div>
                        <div>
                            <label class="form-label">小臂长(cm)</label>
                            <input type="number" id="lowerArmLength" class="form-input" placeholder="请输入小臂长" value="30" min="30" max="60">
                        </div>
                        <div>
                            <label class="form-label">运动目标</label>
                            <select id="sportsGoal" class="form-select">
                                <option value="减肥">减肥</option>
                                <option value="增肌">增肌</option>
                                <option value="保持健康" selected>保持健康</option>
                                <option value="提升体能">提升体能</option>
                                <option value="康复训练">康复训练</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="resetForm" class="btn btn-ghost">重置</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk mr-2"></i>保存设置
                        </button>
                    </div>
                </form>
            </div>

            <!-- Goal Cards -->
            <div class="bg-surface rounded-xl shadow-lg p-6 slide-up border border-white/5">
                <div class="flex justify-between items-center mb-6">
                    <div class="section-header" style="border-bottom:none;margin-bottom:0;padding-bottom:0;">
                        <div class="icon-box coral"><i class="fa-solid fa-bullseye"></i></div>
                        <h3 class="text-xl font-bold font-display tracking-wide text-light">运动目标设定</h3>
                    </div>
                    <button id="editGoalsBtn" class="text-primary hover:text-primary/80 transition-colors font-display tracking-wider text-sm uppercase">
                        <i class="fa-solid fa-pen-to-square mr-1"></i>编辑
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Steps -->
                    <div class="goal-card bg-primary/5 p-6 rounded-xl border border-primary/10">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold font-display tracking-wide">每日步数</h4>
                            <i class="fa-solid fa-shoe-prints text-primary text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-primary mb-2 font-display" id="goalStepValue">10,000</div>
                        <div class="text-sm text-info">目标步数/天</div>
                        <div class="mt-4 bg-white/5 rounded-lg p-3">
                            <div class="flex justify-between text-sm text-info mb-1"><span>今日进度</span><span id="goalStepProgress">0/10,000</span></div>
                            <div class="bg-white/5 rounded-full h-2"><div id="goalStepProgressBar" class="bg-primary rounded-full h-2 goal-progress" style="width:0%"></div></div>
                        </div>
                    </div>
                    <!-- Duration -->
                    <div class="goal-card bg-secondary/5 p-6 rounded-xl border border-secondary/10">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold font-display tracking-wide">运动时长</h4>
                            <i class="fa-solid fa-clock text-success text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-success mb-2 font-display" id="goalTimeValue">60分钟</div>
                        <div class="text-sm text-info">目标时长/天</div>
                        <div class="mt-4 bg-white/5 rounded-lg p-3">
                            <div class="flex justify-between text-sm text-info mb-1"><span>今日进度</span><span id="goalTimeProgress">0/60分钟</span></div>
                            <div class="bg-white/5 rounded-full h-2"><div id="goalTimeProgressBar" class="bg-success rounded-full h-2 goal-progress" style="width:0%"></div></div>
                        </div>
                    </div>
                    <!-- Calories -->
                    <div class="goal-card bg-accent/5 p-6 rounded-xl border border-accent/10">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold font-display tracking-wide">卡路里消耗</h4>
                            <i class="fa-solid fa-fire-flame-curved text-accent text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-accent mb-2 font-display" id="goalCalorieValue">500</div>
                        <div class="text-sm text-info">目标卡路里/天</div>
                        <div class="mt-4 bg-white/5 rounded-lg p-3">
                            <div class="flex justify-between text-sm text-info mb-1"><span>今日进度</span><span id="goalCalorieProgress">0/500</span></div>
                            <div class="bg-white/5 rounded-full h-2"><div id="goalCalorieProgressBar" class="bg-accent rounded-full h-2 goal-progress" style="width:0%"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Activity Chart -->
            <div class="bg-surface rounded-xl shadow-lg p-6 mt-8 slide-up border border-white/5">
                <div class="section-header">
                    <div class="icon-box volt"><i class="fa-solid fa-chart-line"></i></div>
                    <h3 class="text-xl font-bold font-display tracking-wide text-light">本周运动数据</h3>
                </div>
                <div class="chart-container">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Tab Bar -->
    <div class="tab-bar fixed bottom-0 left-0 right-0 z-20">
        <div class="flex justify-around py-2">
            <a href="index.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-home tab-icon text-xl mb-1 text-info"></i>
                <span class="text-xs text-info">首页</span>
            </a>
            <a href="foot.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-shoe-prints tab-icon text-xl mb-1 text-info"></i>
                <span class="text-xs text-info">足部</span>
            </a>
            <a href="threeDimention.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-cube tab-icon text-xl mb-1 text-info"></i>
                <span class="text-xs text-info">3D场景</span>
            </a>
            <a href="arm.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-hand tab-icon text-xl mb-1 text-info"></i>
                <span class="text-xs text-info">手部</span>
            </a>
            <a href="personalInformation.html" class="tab-item active flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-user tab-icon text-xl mb-1 text-primary"></i>
                <span class="text-xs text-primary">我的</span>
            </a>
        </div>
    </div>

    <!-- Avatar Upload Modal -->
    <div id="avatarModal" class="cropper-modal fixed inset-0 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-surface rounded-xl shadow-2xl max-w-md w-full border border-white/10">
                <div class="p-6 border-b border-white/5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold font-display tracking-wide text-light">更换头像</h3>
                        <button id="closeAvatarModal" class="text-info hover:text-light transition-colors">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-6">
                    <div class="mb-4">
                        <input type="file" id="avatarInput" accept="image/*" class="hidden">
                        <button id="selectImageBtn" class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-colors text-info">
                            <i class="fa-solid fa-upload mr-2"></i>选择图片
                        </button>
                    </div>
                    <div id="cropperContainer" class="hidden">
                        <div class="cropper-container mb-4"><img id="cropperImage" class="max-w-full"></div>
                        <div class="flex space-x-3">
                            <button id="cancelCrop" class="flex-1 btn btn-ghost">取消</button>
                            <button id="confirmCrop" class="flex-1 btn btn-primary">确认</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Goal Edit Modal -->
    <div id="goalModal" class="fixed inset-0 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-surface rounded-xl shadow-2xl max-w-md w-full border border-white/10">
                <div class="p-6 border-b border-white/5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold font-display tracking-wide text-light">设置运动目标与进度</h3>
                        <button id="closeGoalModal" class="text-info hover:text-light transition-colors">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-6 space-y-4">
                    <div><label class="form-label">每日步数目标</label><input type="number" id="goalStepInput" class="form-input" min="1" placeholder="输入步数" value="10000"></div>
                    <div><label class="form-label">今日步数进度</label><input type="number" id="goalStepDoneInput" class="form-input" min="0" placeholder="已完成步数" value="0"></div>
                    <div><label class="form-label">每日运动时长(分钟)</label><input type="number" id="goalTimeInput" class="form-input" min="1" placeholder="输入分钟数" value="60"></div>
                    <div><label class="form-label">今日时长进度(分钟)</label><input type="number" id="goalTimeDoneInput" class="form-input" min="0" placeholder="已完成分钟数" value="0"></div>
                    <div><label class="form-label">每日卡路里目标</label><input type="number" id="goalCalorieInput" class="form-input" min="1" placeholder="输入卡路里" value="500"></div>
                    <div><label class="form-label">今日卡路里进度</label><input type="number" id="goalCalorieDoneInput" class="form-input" min="0" placeholder="已消耗卡路里" value="0"></div>
                    <div class="flex justify-end space-x-3 pt-2">
                        <button id="cancelGoal" class="btn btn-ghost">取消</button>
                        <button id="saveGoals" class="btn btn-primary">保存目标</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/page-transition.js"></script>
    <script src="js/particles.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="js/personalInformation.js"></script>
</body>
</html>
