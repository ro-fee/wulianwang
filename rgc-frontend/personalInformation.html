<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 运动数据分析平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="css/personalInformation.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen transition-colors duration-300">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200 relative z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <button id="sidebarToggle" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <h1 class="text-xl font-bold text-gray-900">个人中心</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <button class="bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition-colors">
                        <i class="fa-solid fa-bell"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <!-- 侧边栏 -->
    <div id="sidebar" class="sidebar fixed left-0 top-0 h-full w-80 bg-white shadow-lg z-40 overflow-y-auto custom-scrollbar">
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center space-x-4">
                <img id="sidebarAvatar" src="img/rungirl.jpg" alt="头像" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-md">
                <div>
                    <h3 id="sidebarUserName" class="font-semibold text-gray-900">管理员</h3>
                    <p class="text-sm text-gray-500">运动数据分析师</p>
                </div>
            </div>
        </div>
        <nav class="p-4">
            <div class="space-y-2">
                <a href="index.html" class="flex items-center space-x-3 p-3 hover:bg-gray-50 rounded-lg transition-colors">
                    <i class="fa-solid fa-house text-gray-500"></i><span>首页</span>
                </a>
                <a href="personalInformation.html" class="flex items-center space-x-3 p-3 bg-blue-50 text-primary rounded-lg">
                    <i class="fa-solid fa-user text-primary"></i><span>个人中心</span>
                </a>
                <!-- 足部热力图链接已去除 -->
                <a href="#" class="flex items-center space-x-3 p-3 hover:bg-gray-50 rounded-lg transition-colors">
                    <i class="fa-solid fa-chart-line text-gray-500"></i><span>数据分析</span>
                </a>
                <a href="#" class="flex items-center space-x-3 p-3 hover:bg-gray-50 rounded-lg transition-colors">
                    <i class="fa-solid fa-gear text-gray-500"></i><span>系统设置</span>
                </a>
            </div>
        </nav>
    </div>
    <!-- 侧边栏遮罩 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8 pb-24">
        <div class="max-w-4xl mx-auto">
            <!-- 个人资料卡片 -->
            <div class="user-card rounded-xl shadow-lg overflow-hidden mb-8 slide-up">
                <div class="p-6">
                    <div class="flex flex-col md:flex-row items-center md:items-start space-y-4 md:space-y-0 md:space-x-6">
                        <div class="relative">
                            <img id="userAvatar" src="img/rungirl.jpg" alt="用户头像" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg">
                            <button id="avatarUploadBtn" class="absolute bottom-0 right-0 bg-white text-primary p-2 rounded-full shadow-lg hover:shadow-xl transition-all">
                                <i class="fa-solid fa-camera text-sm"></i>
                            </button>
                        </div>
                        <div class="text-center md:text-left">
                            <h2 id="profileUserName" class="text-2xl font-bold mb-2">管理员</h2>
                            <p class="text-blue-100 mb-2">运动数据分析师</p>
                            <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm">
                                <span class="flex items-center">
                                    <i class="fa-solid fa-calendar-days mr-1"></i>
                                    <span id="profileAge">25岁</span>
                                </span>
                                <span class="flex items-center">
                                    <i class="fa-solid fa-user mr-1"></i>
                                    <span id="profileGender">男</span>
                                </span>
                                <span class="flex items-center">
                                    <i class="fa-solid fa-ruler-vertical mr-1"></i>
                                    <span id="profileHeight">175cm</span>
                                </span>
                                <span class="flex items-center">
                                    <i class="fa-solid fa-weight-scale mr-1"></i>
                                    <span id="profileWeight">70kg</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white bg-opacity-20 backdrop-blur-sm p-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="text-center">
                            <div class="text-2xl font-bold mb-1" id="profileHeightVal">175cm</div>
                            <div class="text-blue-100 text-sm">身高</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold mb-1" id="profileWeightVal">70kg</div>
                            <div class="text-blue-100 text-sm">体重</div>
                        </div>
                        <div class="text-center">
                            <div id="profileBMI" class="text-2xl font-bold mb-1">22.9</div>
                            <div id="bmiStatus" class="text-xs font-semibold mb-1 text-green-300">正常</div>
                            <div class="text-blue-100 text-sm">BMI指数</div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="bmi-indicator mb-2">
                            <div id="bmiMarker" class="bmi-marker" style="left: 50%;"></div>
                        </div>
                        <div class="flex justify-between text-xs text-blue-100">
                            <span>过轻</span><span>正常</span><span>超重</span><span>肥胖</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 个人信息设置 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-8 slide-up">
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fa-solid fa-user-pen text-primary mr-2"></i>
                    个人信息设置
                </h3>
                <form id="profileForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">昵称</label>
                            <input type="text" id="nickname" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入昵称" value="管理员">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">性别</label>
                            <select id="gender" class="w-full p-3 border border-gray-300 rounded-lg form-input">
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">年龄</label>
                            <input type="number" id="age" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入年龄" value="25" min="1" max="120">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">身高(cm)</label>
                            <input type="number" id="height" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入身高" value="175" min="100" max="250">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">体重(kg)</label>
                            <input type="number" id="weight" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入体重" value="70" min="30" max="300" step="0.1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">大臂长(cm)</label>
                            <input type="number" id="upperArmLength" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入大臂长" value="30" min="15" max="50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">小臂长(cm)</label>
                            <input type="number" id="lowerArmLength" class="w-full p-3 border border-gray-300 rounded-lg form-input" placeholder="请输入小臂长" value="30" min="30" max="60">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">运动目标</label>
                            <select id="sportsGoal" class="w-full p-3 border border-gray-300 rounded-lg form-input">
                                <option value="减肥">减肥</option>
                                <option value="增肌">增肌</option>
                                <option value="保持健康" selected>保持健康</option>
                                <option value="提升体能">提升体能</option>
                                <option value="康复训练">康复训练</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="resetForm" class="px-6 py-3 text-gray-600 hover:text-gray-800 transition-colors font-medium">重置
                        </button>
                        <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors shadow-lg hover:shadow-xl font-medium">
                            <i class="fa-solid fa-floppy-disk mr-2"></i>保存设置
                        </button>
                    </div>
                </form>
            </div>
            <!-- 运动目标卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 slide-up">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-gray-900 flex items-center">
                        <i class="fa-solid fa-bullseye text-primary mr-2"></i>
                        运动目标设定
                    </h3>
                    <button id="editGoalsBtn" class="text-primary hover:text-blue-600 transition-colors">
                        <i class="fa-solid fa-pen-to-square mr-1"></i>编辑
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- 步数 -->
                    <div class="goal-card bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-xl">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold text-gray-900">每日步数</h4>
                            <i class="fa-solid fa-shoe-prints text-primary text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-primary mb-2" id="goalStepValue">10,000</div>
                        <div class="text-sm text-gray-600">目标步数/天</div>
                        <div class="mt-4 bg-white rounded-lg p-2">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>今日进度</span>
                                <span id="goalStepProgress">0/10,000</span>
                            </div>
                            <div class="bg-gray-200 rounded-full h-2">
                                <div id="goalStepProgressBar" class="bg-primary rounded-full h-2 goal-progress" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                    <!-- 时长 -->
                    <div class="goal-card bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-xl">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold text-gray-900">运动时长</h4>
                            <i class="fa-solid fa-clock text-success text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-success mb-2" id="goalTimeValue">60分钟</div>
                        <div class="text-sm text-gray-600">目标时长/天</div>
                        <div class="mt-4 bg-white rounded-lg p-2">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>今日进度</span>
                                <span id="goalTimeProgress">0/60分钟</span>
                            </div>
                            <div class="bg-gray-200 rounded-full h-2">
                                <div id="goalTimeProgressBar" class="bg-success rounded-full h-2 goal-progress" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                    <!-- 卡路里 -->
                    <div class="goal-card bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-xl">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="font-semibold text-gray-900">卡路里消耗</h4>
                            <i class="fa-solid fa-fire-flame-curved text-accent text-xl"></i>
                        </div>
                        <div class="text-2xl font-bold text-accent mb-2" id="goalCalorieValue">500</div>
                        <div class="text-sm text-gray-600">目标卡路里/天</div>
                        <div class="mt-4 bg-white rounded-lg p-2">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>今日进度</span>
                                <span id="goalCalorieProgress">0/500</span>
                            </div>
                            <div class="bg-gray-200 rounded-full h-2">
                                <div id="goalCalorieProgressBar" class="bg-accent rounded-full h-2 goal-progress" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 运动数据图表 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mt-8 slide-up">
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fa-solid fa-chart-line text-primary mr-2"></i>
                    本周运动数据
                </h3>
                <div class="chart-container">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>
    </main>
    <div class="tab-bar fixed bottom-0 left-0 right-0 z-20">
        <div class="flex justify-around py-2">
            <a href="index.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-home tab-icon text-xl mb-1 text-gray-500"></i>
                <span class="text-xs text-gray-500">首页</span>
            </a>
            <a href="foot.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-shoe-prints tab-icon text-xl mb-1 text-gray-500"></i>
                <span class="text-xs text-gray-500">足部</span>
            </a>
            <a href="threeDimention.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <!-- 将图标类名替换为 fa-cube -->
                <i class="fa-solid fa-cube tab-icon text-xl mb-1 text-gray-500"></i>
                <span class="text-xs text-gray-500">3D场景</span>
            </a>
            <a href="arm.html" class="tab-item flex flex-col items-center p-2 min-w-0 flex-1">
                <!-- 将图标类名替换为 fa-hand -->
                <i class="fa-solid fa-hand tab-icon text-xl mb-1 text-gray-500"></i>
                <span class="text-xs text-gray-500">手部</span>
            </a>
            <a href="personalInformation.html" class="tab-item active flex flex-col items-center p-2 min-w-0 flex-1">
                <i class="fa-solid fa-user tab-icon text-xl mb-1"></i>
                <span class="text-xs">我的</span>
            </a>
        </div>
    </div>
    <!-- 头像上传模态框 -->
    <div id="avatarModal" class="cropper-modal fixed inset-0 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-900">更换头像</h3>
                        <button id="closeAvatarModal" class="text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-6">
                    <div class="mb-4">
                        <input type="file" id="avatarInput" accept="image/*" class="hidden">
                        <button id="selectImageBtn" class="w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-lg transition-colors text-gray-700">
                            <i class="fa-solid fa-upload mr-2"></i>选择图片
                        </button>
                    </div>
                    <div id="cropperContainer" class="hidden">
                        <div class="cropper-container mb-4">
                            <img id="cropperImage" class="max-w-full">
                        </div>
                        <div class="flex space-x-3">
                            <button id="cancelCrop" class="flex-1 py-2 px-4 text-gray-600 hover:text-gray-800 transition-colors font-medium">
                                取消
                            </button>
                            <button id="confirmCrop" class="flex-1 py-2 px-4 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors font-medium">
                                确认
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 运动目标编辑模态框，包含进度录入 -->
    <div id="goalModal" class="fixed inset-0 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-900">设置运动目标与进度</h3>
                        <button id="closeGoalModal" class="text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">每日步数目标</label>
                        <input type="number" id="goalStepInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="1" placeholder="输入步数" value="10000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">今日步数进度</label>
                        <input type="number" id="goalStepDoneInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="0" placeholder="已完成步数" value="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">每日运动时长(分钟)</label>
                        <input type="number" id="goalTimeInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="1" placeholder="输入分钟数" value="60">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">今日时长进度(分钟)</label>
                        <input type="number" id="goalTimeDoneInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="0" placeholder="已完成分钟数" value="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">每日卡路里目标</label>
                        <input type="number" id="goalCalorieInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="1" placeholder="输入卡路里" value="500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">今日卡路里进度</label>
                        <input type="number" id="goalCalorieDoneInput" class="w-full p-3 border border-gray-300 rounded-lg form-input" min="0" placeholder="已消耗卡路里" value="0">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button id="cancelGoal" class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium">取消</button>
                        <button id="saveGoals" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 font-medium">保存目标</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="js/personalInformation.js"></script>
</body>
</html>
