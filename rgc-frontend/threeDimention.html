<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>智能姿势评估系统</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="css/threeDimention.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script>

</head>

<body>
  <div id="canvas-container"></div>

  <!-- 新增复位按钮 -->
  <div style="position: absolute; top: 20px; width: 100%; text-align: center; z-index: 2;">
    <button id="resetDeviceBtn" class="reset-device-btn">复位设备</button>
  </div>

  <!-- 左侧抽屉打开按钮 -->
  <button class="open-left-panel-btn" id="openLeftPanelBtn" title="摆臂动作分析">
    <i class="fas fa-running fa-fw"></i>
  </button>

  <div id="left-panel" aria-modal="true" aria-label="摆臂动作分析" tabindex="-1">
    <header>
      <button class="back-button" id="closeLeftPanelBtn" tabindex="0" title="关闭">
        <i class="fas fa-times"></i>
      </button>
      <div class="header-title-left">摆臂动作分析</div>
      <!-- 滑动按钮添加 id -->
      <label class="toggle-switch">
        <input type="checkbox" id="run-mode-select">
        <span class="toggle-slider"></span>
        <div class="toggle-labels">
          <span>长</span>
          <span>短</span>
        </div>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="arm-select">
        <span class="toggle-slider"></span>
        <div class="toggle-labels">
          <span>左</span>
          <span>右</span>
        </div>
      </label>
    </header>

    <!--基本信息框 -->
    <div class="left-panel-box">
      <div class="left-panel-box-title">
        <h3>基本信息</h3>
      </div>
      <div class="left-panel-box-content">
        <div class="info-container">
          <div class="single-info-wrapper">
            <div class="info-item">身高: <span id="height" class="info-value">170</span> cm</div>
          </div>
          <div class="single-info-wrapper">
            <div class="info-item">体重: <span id="weight" class="info-value">60</span> kg</div>
          </div>
          <div class="single-info-wrapper">
            <div class="info-item">BMI: <span id="bmi" class="info-value">20.8</span></div>
          </div>
        </div>
        <div class="info-container">
          <div class="single-info-wrapper">
            <div class="info-item">年龄: <span id="age" class="info-value">25</span> 岁</div>
          </div>
          <div class="single-info-wrapper">
            <div class="info-item">大臂长: <span id="upperArmLength" class="info-value">30</span> cm</div>
          </div>
          <div class="single-info-wrapper">
            <div class="info-item">小臂长: <span id="lowerArmLength" class="info-value">30</span> cm</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 摆臂角度框 -->
    <div class="left-panel-box">
      <div class="left-panel-box-title">
        <h3>摆臂角度</h3>
      </div>
      <div class="left-panel-box-content arm-angle-content">
        <div class="arm-angle-row">
          <div class="single-info-wrapper">
            <div class="info-item">肘关节弯曲角度: <span id="elbowAngle" class="info-value">0</span>°</div>
          </div>
        </div>
        <div class="arm-angle-row">
          <div class="single-info-wrapper">
            <!-- 用于显示左右摆臂角度 -->
            <div class="info-item">左右摆臂角度: <span id="leftRightAngle" class="info-value">0</span>°</div>
          </div>
          <div class="single-info-wrapper">
            <div class="info-item">前后摆臂角度: <span id="frontBackAngle" class="info-value">0</span>°</div>
          </div>
        </div>
      </div>
      <div class="expand-detail-btn-box">
        <button class="expand-detail-btn" id="expandAngleDetail">
          <span>展开详细</span>
        </button>
      </div>
    </div>



    <div class="left-panel-box">
      <div class="left-panel-box-title">
        <h3>摆臂幅度</h3>
      </div>
      <div class="left-panel-box-content swing-angle-content">
        <div class="swing-angle-row">
          <div class="swing-single-info-wrapper">
            <div class="swing-info-item">左右摆幅: <span id="leftRightSwing" class="info-value">0</span> cm</div>
          </div>
          <div class="swing-single-info-wrapper">
            <div class="swing-info-item">前后摆幅: <span id="frontBackSwing" class="info-value">0</span> cm</div>
          </div>
        </div>
      </div>
      <div class="expand-detail-btn-box">
        <button class="expand-detail-btn" id="expandSwingDetail">
          <span>展开详细</span>
        </button>
      </div>
    </div>


    <!-- 对称性框 -->
    <div class="left-panel-box">
      <div class="left-panel-box-title">
        <h3>摆臂对称性</h3>
      </div>
      <div class="left-panel-box-content swing-angle-content">
        <div class="swing-angle-row">
          <div class="swing-single-info-wrapper">
            <div class="swing-info-item">左右摆臂对称性: <span id="leftRightArmSymmetry" class="info-value">差</span></div>
          </div>
          <div class="swing-single-info-wrapper">
            <div class="swing-info-item">前后摆臂对称性: <span id="frontBackArmSymmetry" class="info-value">差</span></div>
          </div>
        </div>
      </div>
      <div class="expand-detail-btn-box">
        <button class="expand-detail-btn" id="expandSymmetryDetail">
          <span>展开详细</span>
        </button>
      </div>
    </div>
    <!-- 协调框 -->
    <div class="left-panel-box">
      <div class="left-panel-box-title">
        <h3>摆臂协调性</h3>
      </div>
      <div class="left-panel-box-content swing-angle-content">
        <div class="swing-angle-row">
          <div class="swing-single-info-wrapper">
            <div class="swing-info-item">摆臂与步频协调性: <span id="armStepCoordination" class="info-value">差</span></div>
          </div>
        </div>
      </div>
      <div class="expand-detail-btn-box">
        <button class="expand-detail-btn" id="expandCoordinationDetail">
          <span>展开详细</span>
        </button>
      </div>
    </div>




  </div>

  <!-- 呼出面板按钮 -->
  <button class="open-panel-btn" id="openPanelBtn" title="波形图界面">
    <i class="fas fa-wave-square fa-fw"></i>
  </button>

  <!-- 侧边抽屉面板 -->
  <div id="panel" aria-modal="true" aria-label="波形图界面" tabindex="-1">
    <header>
      <button class="back-button" id="closePanelBtn" tabindex="0" title="关闭">
        <i class="fas fa-times"></i>
      </button>
      <div class="header-title-right">波形图界面</div>
    </header>

    <div class="angle-box-container">
      <div class="angle-box">
        <div class="chart-header">
          <h3>左大臂欧拉角</h3>
        </div>
        <div class="box-content">
          <canvas id="chart_left_upper" height="250"></canvas>
        </div>
      </div>
      <div class="angle-box">
        <div class="chart-header">
          <h3>左小臂欧拉角</h3>
        </div>
        <div class="box-content">
          <canvas id="chart_left_lower" height="250"></canvas>
        </div>
      </div>
      <div class="angle-box">
        <div class="chart-header">
          <h3>右大臂欧拉角</h3>
        </div>
        <div class="box-content">
          <canvas id="chart_right_upper" height="250"></canvas>
        </div>
      </div>
      <div class="angle-box">
        <div class="chart-header">
          <h3>右小臂欧拉角</h3>
        </div>
        <div class="box-content">
          <canvas id="chart_right_lower" height="250"></canvas>
        </div>
      </div>
    </div>
  </div>
  <!-- 新增弹出框 HTML 结构 -->
  <div id="detailModal" class="modal">
    <div class="modal-header">
      <button class="modal-close-btn" id="closeModalBtn">
        <i class="fas fa-times"></i>
      </button>
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script src="js/buttonConfig.js"></script>
  <script type="module">
    // 面板交互（保留）
    const panel = document.getElementById('panel');
    const openBtn = document.getElementById('openPanelBtn');
    const closeBtn = document.getElementById('closePanelBtn');
    // 初始化摆臂对称性计算所需变量
    let leftMaxSwingAngle_temp = 0;
    let rightMaxSwingAngle_temp = 0;
    let leftMaxSwingAngle = 0;
    let rightMaxSwingAngle = 0;
    let isRecordingLeft = false;
    let isRecordingRight = false;
    // 新增左右摆臂对称性变量
    let leftMaxLeftRight_temp = 0;
    let rightMaxLeftRight_temp = 0;
    let leftMaxLeftRight = 0;
    let rightMaxLeftRight = 0;
    let isRecordingLeftLR = false;
    let isRecordingRightLR = false;

    // 新增：实时压力数据和状态标志变量
    let leftFootPressure = 0;       // 左脚实时压力值
    let rightFootPressure = 0;      // 右脚实时压力值
    let stateQueue = [];          // 状态循环队列
    const QUEUE_MAX_LENGTH = 10;  // 队列最大长度
    const pressureThreshold = 100; // 压力阈值
    let consecutiveCCount = 0;      // C状态连续计数
    let consecutiveDCount = 0;      // D状态连续计数
    let upperArmLength = 30;
    //被全局化的一些变量
    let coordinationResult = "差";
    let lrSymmetryLevel = "优";
    let fbSymmetryLevel = "优";
    let leftUpperAngles = { x: null, y: null, z: null };
    let leftLowerAngles = { x: null, y: null, z: null };
    let rightUpperAngles = { x: null, y: null, z: null };
    let rightLowerAngles = { x: null, y: null, z: null };
    let elbowLeftAngle = 0;
    let elbowRightAngle = 0;

    function openPanel() {
      panel.classList.add('open');
      panel.focus();
      setTimeout(() => { panel.scrollTop = 0; }, 150);
      setTimeout(() => {
        Object.values(chartObjs).forEach(chart => chart.resize());
      }, 300);
    }
    function closePanel() {
      panel.classList.remove('open');
    }
    openBtn.onclick = openPanel;
    closeBtn.onclick = closePanel;
    window.addEventListener('keydown', (e) => {
      if ((panel.classList.contains('open')) && (e.key === 'Escape')) closePanel();
    });
    if (window.innerWidth > 900) setTimeout(openPanel, 130);


    // 波形图核心：仅负责渲染，通过事件接收数据
    const JOINTS = [
      { key: 'left_upper', label: '左大臂' },
      { key: 'left_lower', label: '左小臂' },
      { key: 'right_upper', label: '右大臂' },
      { key: 'right_lower', label: '右小臂' }
    ];
    const chartObjs = {};
    const MAX_POINTS = 200;
    let globalIndex = 0;

    document.addEventListener('DOMContentLoaded', () => {
      // 初始化图表（保留原有配置，修复图例pointRadius）
      JOINTS.forEach(joint => {
        const ctx = document.getElementById(`chart_${joint.key}`).getContext('2d');

        // 渐变背景（保留）
        const gradientX = ctx.createLinearGradient(0, 0, 0, 300);
        gradientX.addColorStop(0, 'rgba(255, 99, 132, 0.8)');
        gradientX.addColorStop(1, 'rgba(255, 99, 132, 0.1)');

        const gradientY = ctx.createLinearGradient(0, 0, 0, 300);
        gradientY.addColorStop(0, 'rgba(75, 192, 192, 0.8)');
        gradientY.addColorStop(1, 'rgba(75, 192, 192, 0.1)');

        const gradientZ = ctx.createLinearGradient(0, 0, 0, 300);
        gradientZ.addColorStop(0, 'rgba(153, 102, 255, 0.8)');
        gradientZ.addColorStop(1, 'rgba(153, 102, 255, 0.1)');

        chartObjs[joint.key] = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [],
            datasets: [
              {
                label: '滚转',
                data: [],
                borderColor: '#FF6384',
                backgroundColor: gradientX,
                borderWidth: 0,
                pointRadius: 0,
                tension: 0.2,
                fill: true
              },
              {
                label: '俯仰',
                data: [],
                borderColor: '#36A2EB',
                backgroundColor: gradientY,
                borderWidth: 0,
                pointRadius: 0,
                tension: 0.2,
                fill: true
              },
              {
                label: '偏航',
                data: [],
                borderColor: '#9966FF',
                backgroundColor: gradientZ,
                borderWidth: 0,
                pointRadius: 0,
                tension: 0.2,
                fill: true
              }
            ]
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            scales: { /* 保留原有配置 */ },
            plugins: {
              legend: {
                labels: {
                  color: '#E2E8F0',
                  usePointStyle: true,
                  padding: 10,
                  pointStyle: 'circle',
                  pointRadius: 5, // 修正：从0.2改为5，确保可见
                  font: { size: 13 }
                },
                position: 'top',
                align: 'center',
                maxHeight: 30
              },
              tooltip: { /* 保留原有配置 */ }
            }
          }
        });
      });

      // 监听3D模块的关节数据更新事件
      document.addEventListener('jointDataUpdate', (event) => {
        const { jointKey, dataArr } = event.detail;
        const chart = chartObjs[jointKey];
        if (!chart) return;

        // 更新图表数据（保留原有修正逻辑）
        chart.data.labels.push(globalIndex);
        dataArr.slice(0, 3).forEach((val, i) => {
          if (
            (jointKey === 'right_lower' && i === 1) ||
            (jointKey === 'right_upper' && i === 0) ||
            (jointKey === 'left_lower' && i === 0) ||
            (jointKey === 'left_upper' && i === 1)
          ) {
            val = -val;
          }
          chart.data.datasets[i].data.push(val);
        });
        if (chart.data.labels.length > MAX_POINTS) {
          chart.data.labels.shift();
          chart.data.datasets.forEach(ds => ds.data.shift());
        }
        chart.update('none');
        globalIndex++;
      });
    });
    // 新增左侧抽屉交互逻辑
    const leftPanel = document.getElementById('left-panel');
    const openLeftBtn = document.getElementById('openLeftPanelBtn');
    const closeLeftBtn = document.getElementById('closeLeftPanelBtn');

    function openLeftPanel() {
      leftPanel.classList.add('open');
      leftPanel.focus();
      setTimeout(() => { leftPanel.scrollTop = 0; }, 150);
      setTimeout(() => {
        // 如果左侧抽屉有图表，可在这里添加图表 resize 逻辑
      }, 300);
    }

    function closeLeftPanel() {
      leftPanel.classList.remove('open');
    }

    openLeftBtn.onclick = openLeftPanel;
    closeLeftBtn.onclick = closeLeftPanel;

    window.addEventListener('keydown', (e) => {
      if ((leftPanel.classList.contains('open')) && (e.key === 'Escape')) closeLeftPanel();
    });

    if (window.innerWidth > 900) setTimeout(openLeftPanel, 130);
    // 新增函数：从 localStorage 获取用户信息并更新页面
    function updateUserInfo() {
      const userInfoString = localStorage.getItem('userInfo');
      if (userInfoString) {
        const userInfo = JSON.parse(userInfoString);
        // 计算 BMI
        const heightInMeters = userInfo.height / 100;
        const bmi = (userInfo.weight / (heightInMeters * heightInMeters)).toFixed(1);

        // 更新页面元素
        document.getElementById('height').textContent = userInfo.height;
        document.getElementById('weight').textContent = userInfo.weight;
        document.getElementById('bmi').textContent = bmi;
        document.getElementById('age').textContent = userInfo.age;
        document.getElementById('upperArmLength').textContent = userInfo.upperArmLength;
        document.getElementById('lowerArmLength').textContent = userInfo.lowerArmLength;
      }
    }

    // 在 DOM 加载完成后调用更新函数
    document.addEventListener('DOMContentLoaded', () => {

      updateUserInfo();
    });

    const detailModal = document.getElementById('detailModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');

    function openModal(title, content) {
      // 动态获取肘关节弯曲角度
      const elbowAngle = document.getElementById('elbowAngle').textContent;
      // 替换静态数据为动态数据
      const dynamicContent = content.replace('左手0°，右手0°', `左手${elbowAngle}°，右手${elbowAngle}°`);
      modalTitle.textContent = title;
      modalContent.innerHTML = dynamicContent;
      detailModal.classList.add('open');
    }

    function closeModal() {
      detailModal.classList.remove('open');
    }

    closeModalBtn.onclick = closeModal;
    window.addEventListener('keydown', (e) => {
      if (detailModal.classList.contains('open') && e.key === 'Escape') {
        closeModal();
      }
    });


    window.expandButtons.forEach(buttonInfo => {
      const button = document.getElementById(buttonInfo.id);
      if (button) {
        button.onclick = () => {
          openModal(buttonInfo.title, buttonInfo.content);
        };
      }
    });

    // 初始化three.js场景
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, renderer, camera, controls, model;

    // 存储当前旋转和目标旋转（关键：用插值实现平滑过渡）
    let currentRotations = {
      left_upper: { x: 0, y: 0, z: 0 },
      left_lower: { x: 0, y: 0, z: 0 },
      right_upper: { x: 0, y: 0, z: 0 },
      right_lower: { x: 0, y: 0, z: 0 }
    };
    let targetRotations = {
      left_upper: { x: 0, y: 0, z: 0 },
      left_lower: { x: 0, y: 0, z: 0 },
      right_upper: { x: 0, y: 0, z: 0 },
      right_lower: { x: 0, y: 0, z: 0 }
    };

    // 本地BLE桥接WebSocket配置
    const BRIDGE_WS_URL = `ws://${window.location.hostname || '127.0.0.1'}:8765`;
    let bridgeSocket = null;
    let bridgeReconnectTimer = null;
    let bridgeReconnectCount = 0;
    const MAX_RECONNECT = 20;




    function initScene() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      // 使用 TextureLoader 加载背景图片
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load('img/cloud.png', (texture) => {
        // 将加载的纹理设置为场景背景
        scene.background = texture;
      }, undefined, (err) => {
        console.error('背景图片加载失败:', err);
        // 加载失败时使用默认颜色
        scene.background = new THREE.Color(0x222222);
      });

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const scaleFactor = 0.6;
      camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0 * scaleFactor, 0.5 * scaleFactor, 5.5 * scaleFactor);
      camera.lookAt(0, 0, 0);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 降低环境光强度
      scene.add(new THREE.AmbientLight(0xffffff, 0.1));
      const light1 = new THREE.DirectionalLight(0xffffff, 1);
      light1.position.set(2, 4, 3);
      scene.add(light1);
      const light2 = new THREE.DirectionalLight(0xffffff, 0.3);
      light2.position.set(-2, 3, -3);
      scene.add(light2);

      // 加载草坪纹理
      const groundTexture = textureLoader.load(
        'img/grassBackground.jpg'
      );
      // 设置纹理重复和偏移
      groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
      groundTexture.repeat.set(3, 3);

      // 创建带有纹理的草坪材质，设置相对亮一些的基础颜色
      const grassMaterial = new THREE.MeshStandardMaterial({
        map: groundTexture,
      });
      const grassGeometry = new THREE.PlaneGeometry(20, 20);
      const grass = new THREE.Mesh(grassGeometry, grassMaterial);
      grass.rotation.x = -Math.PI / 2;
      grass.position.y = -1;
      grass.receiveShadow = true;
      scene.add(grass);

      // 添加聚光灯
      const spotLight = new THREE.SpotLight(0xffffff, 2);
      // 设置聚光灯位置在小人头顶正上方
      spotLight.position.set(0 * scaleFactor, 5 * scaleFactor, 5 * scaleFactor);
      spotLight.angle = Math.PI / 8; // 聚光角度，可按需调整
      spotLight.penumbra = 0.4; // 半影衰减
      spotLight.decay = 2; // 光照衰减
      spotLight.distance = 20; // 光照距离
      // 设置聚光灯目标方向为下方
      spotLight.target.position.set(0, -1, 0);

      // 设置聚光灯目标为场景原点（小人所在位置）
      spotLight.target.position.set(0, 0, 0);
      scene.add(spotLight.target);

      scene.add(spotLight);

      // 开启阴影
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      spotLight.castShadow = true;

      // 设置阴影属性
      spotLight.shadow.mapSize.width = 1024;
      spotLight.shadow.mapSize.height = 1024;
      spotLight.shadow.camera.near = 1;
      spotLight.shadow.camera.far = 20;
      spotLight.shadow.camera.fov = 30;

      function createAxisLabel(text, color, position) {
        const canvas = document.createElement('canvas');
        // 添加canvas尺寸设置
        canvas.width = 64;  // 设置画布宽度
        canvas.height = 32; // 设置画布高度
        const context = canvas.getContext('2d');
        context.font = '14px Arial';
        context.fillStyle = color;
        // 文本居中显示
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(text, canvas.width / 2, canvas.height / 2); // 居中绘制文本

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(material);
        sprite.position.copy(position);
        sprite.scale.set(0.8, 0.4, 1); // 调整标签大小（缩小为原来的1/15）
        return sprite;
      }

      animate();
    }





    function loadFBX() {
      const loader = new FBXLoader();
      loader.load("img/manModule.fbx", obj => {
        model = obj;
        model.scale.set(0.01, 0.01, 0.01);
        model.position.set(0, -1, 0);
        // 确保模型正面朝向相机（z 轴正方向），这里取消绕 y 轴 180 度旋转
        model.rotation.y = 0;
        scene.add(model);
        resetJoints(); // 初始化关节角度
      }, undefined, err => {
        console.error("模型加载错误:", err);
      });
    }
    // 重置关节初始角度
    function resetJoints() {
      if (!model) return;
      model.traverse(child => {
        if (['mixamorigLeftArm', 'mixamorigLeftForeArm', 'mixamorigRightArm', 'mixamorigRightForeArm'].includes(child.name)) {
          child.rotation.set(0, 0, 0);
        }
      });
    }





    function updateJoints() {
      if (!model) return;

      const lerpFactor = 0.15;

      for (const joint in currentRotations) {
        currentRotations[joint].x = THREE.MathUtils.lerp(
          currentRotations[joint].x,
          targetRotations[joint].x,
          lerpFactor
        );
        currentRotations[joint].y = THREE.MathUtils.lerp(
          currentRotations[joint].y,
          targetRotations[joint].y,
          lerpFactor
        );
        currentRotations[joint].z = THREE.MathUtils.lerp(
          currentRotations[joint].z,
          targetRotations[joint].z,
          lerpFactor
        );
      }


      //-----------------左侧边抽屉信息处理---------------------------------------------------------------------------------------
      leftUpperAngles = { x: null, y: null, z: null };
      leftLowerAngles = { x: null, y: null, z: null };
      rightUpperAngles = { x: null, y: null, z: null };
      rightLowerAngles = { x: null, y: null, z: null };

      // 存储大臂和小臂的方向向量
      const leftUpperArmVector = new THREE.Vector3(0, -1, 0); // 初始方向向下
      const leftLowerArmVector = new THREE.Vector3(0, -1, 0);
      const rightUpperArmVector = new THREE.Vector3(0, -1, 0);
      const rightLowerArmVector = new THREE.Vector3(0, -1, 0);

      model.traverse(child => {
        let jointInfo = null;
        let rotation;
        switch (child.name) {
          case 'mixamorigLeftArm': // 左大臂
            child.rotation.order = 'ZXY';
            rotation = new THREE.Euler(
              -currentRotations.left_upper.y,
              -currentRotations.left_upper.x,
              -currentRotations.left_upper.z
            );
            child.rotation.copy(rotation);
            jointInfo = { joint: 'left_upper', angles: child.rotation };
            // 计算大臂方向向量
            leftUpperArmVector.copy(new THREE.Vector3(0, -1, 0)).applyEuler(rotation);
            break;
          case 'mixamorigLeftForeArm': // 左小臂
            child.rotation.order = 'ZXY';
            // 1. 创建父骨骼（左大臂）在世界坐标系中的旋转
            const leftUpperWorldRot = new THREE.Euler(
              -currentRotations.left_upper.y,
              -currentRotations.left_upper.x,
              -currentRotations.left_upper.z,
              'ZXY'
            );
            const leftUpperWorldQuat = new THREE.Quaternion().setFromEuler(leftUpperWorldRot);

            // 2. 创建小臂在世界坐标系中的目标旋转（来自传感器数据）
            const leftForearmWorldRot = new THREE.Euler(
              currentRotations.left_lower.y,
              currentRotations.left_lower.x,
              -currentRotations.left_lower.z,
              'ZXY'
            );
            const leftForearmWorldQuat = new THREE.Quaternion().setFromEuler(leftForearmWorldRot);

            // 3. 计算小臂相对于大臂的局部旋转
            // 公式：局部旋转 = 父骨骼世界旋转的逆 × 子骨骼世界旋转
            const leftForearmLocalQuat = new THREE.Quaternion()
              .copy(leftUpperWorldQuat)
              .invert()
              .multiply(leftForearmWorldQuat);

            // 4. 将局部旋转转换为欧拉角并应用
            rotation = new THREE.Euler().setFromQuaternion(leftForearmLocalQuat, 'ZXY');
            child.rotation.copy(rotation);
            jointInfo = { joint: 'left_lower', angles: child.rotation };
            // 计算小臂方向向量
            leftLowerArmVector.copy(new THREE.Vector3(0, -1, 0)).applyEuler(rotation);
            break;
          
          case 'mixamorigRightArm': // 右大臂
            child.rotation.order = 'ZXY';
            rotation = new THREE.Euler(
              -currentRotations.right_upper.y,
              -currentRotations.right_upper.x,
              -currentRotations.right_upper.z,
            );
            child.rotation.copy(rotation);
            jointInfo = { joint: 'right_upper', angles: child.rotation };
            rightUpperArmVector.copy(new THREE.Vector3(0, -1, 0)).applyEuler(rotation);
            break;
          case 'mixamorigRightForeArm': // 右小臂
            child.rotation.order = 'ZXY';
            // 1. 创建父骨骼（右大臂）在世界坐标系中的旋转
            const rightUpperWorldRot = new THREE.Euler(
              -currentRotations.right_upper.y,
              -currentRotations.right_upper.x,
              -currentRotations.right_upper.z,
              'ZXY'
            );
            const rightUpperWorldQuat = new THREE.Quaternion().setFromEuler(rightUpperWorldRot);

            // 2. 创建小臂在世界坐标系中的目标旋转（来自传感器数据）
            const rightForearmWorldRot = new THREE.Euler(
              currentRotations.right_lower.y,
              currentRotations.right_lower.x,
              -currentRotations.right_lower.z,
              'ZXY'
            );
            const rightForearmWorldQuat = new THREE.Quaternion().setFromEuler(rightForearmWorldRot);

            // 3. 计算小臂相对于大臂的局部旋转
            // 公式：局部旋转 = 父骨骼世界旋转的逆 × 子骨骼世界旋转
            const rightForearmLocalQuat = new THREE.Quaternion()
              .copy(rightUpperWorldQuat)
              .invert()
              .multiply(rightForearmWorldQuat);

            // 4. 将局部旋转转换为欧拉角并应用
            rotation = new THREE.Euler().setFromQuaternion(rightForearmLocalQuat, 'ZXY');
            child.rotation.copy(rotation);
            jointInfo = { joint: 'right_lower', angles: child.rotation };
            rightLowerArmVector.copy(new THREE.Vector3(0, -1, 0)).applyEuler(rotation);
            break;
          
        }
        if (jointInfo) {
          const currentAngles = {
            x: THREE.MathUtils.radToDeg(jointInfo.angles.x).toFixed(1),
            y: THREE.MathUtils.radToDeg(jointInfo.angles.y).toFixed(1),
            z: THREE.MathUtils.radToDeg(jointInfo.angles.z).toFixed(1)
          };

          switch (jointInfo.joint) {
            case 'left_upper':
              leftUpperAngles.x = currentAngles.x;
              leftUpperAngles.y = currentAngles.y;
              leftUpperAngles.z = currentAngles.z;
              break;
            case 'left_lower':
              leftLowerAngles.x = currentAngles.x;
              leftLowerAngles.y = currentAngles.y;
              leftLowerAngles.z = currentAngles.z;
              break;
            case 'right_upper':
              rightUpperAngles.x = currentAngles.x;
              rightUpperAngles.y = currentAngles.y;
              rightUpperAngles.z = currentAngles.z;
              break;
            case 'right_lower':
              rightLowerAngles.x = currentAngles.x;
              rightLowerAngles.y = currentAngles.y;
              rightLowerAngles.z = currentAngles.z;
              break;
          }
        }
      });

      const valueMaxLength = 6;

      // 格式化每个角度值，保证长度一致
      const formatValue = (value) => (value || '0.0').padEnd(valueMaxLength);



      // 获取滑动按钮和显示角度的元素
      const armSelect = document.getElementById('arm-select');
      const leftRightAngleSpan = document.getElementById('leftRightAngle');
      const elbowAngleSpan = document.getElementById('elbowAngle');
      const frontBackAngleSpan = document.getElementById('frontBackAngle');
      const leftRightSwingSpan = document.getElementById('leftRightSwing');
      const frontBackSwingSpan = document.getElementById('frontBackSwing');

      // 获取大臂长，从 localStorage 中获取用户信息
      const userInfoString = localStorage.getItem('userInfo');
      upperArmLength = 30; // 默认值
      if (userInfoString) {
        const userInfo = JSON.parse(userInfoString);
        upperArmLength = parseFloat(userInfo.upperArmLength);
      }

      if (armSelect && leftRightAngleSpan && elbowAngleSpan && frontBackAngleSpan && leftRightSwingSpan && frontBackSwingSpan) {
        const isLeft = armSelect.checked;
        const upperAngles = isLeft ? leftUpperAngles : rightUpperAngles;
        const lowerAngles = isLeft ? leftLowerAngles : rightLowerAngles;

        // 左右摆臂角度（度数）
        const leftRightAngleDeg = -parseFloat(upperAngles.x || 0) + 90; // 线性映射传感器角度到显示角度
        leftRightAngleSpan.textContent = Math.round(leftRightAngleDeg);

        // 前后摆臂角度（度数）√
        const frontBackAngleDeg = -parseFloat(upperAngles.z || 0);
        frontBackAngleSpan.textContent = Math.round(frontBackAngleDeg);

        // 左右摆臂角度（弧度）√
        const leftRightAngleRad = THREE.MathUtils.degToRad(leftRightAngleDeg);
        // 前后摆臂角度（弧度）
        const frontBackAngleRad = THREE.MathUtils.degToRad(frontBackAngleDeg);

        // 计算左右摆幅
        const leftRightSwing = upperArmLength * leftRightAngleRad;
        leftRightSwingSpan.textContent = Math.round(leftRightSwing);

        // 计算前后摆幅
        const frontBackSwing = upperArmLength * frontBackAngleRad;
        frontBackSwingSpan.textContent = Math.round(frontBackSwing);
        if (isLeft) {
          frontBackSwingSpan.textContent = -Math.round(frontBackSwing);
        }


        // 肘关节弯曲角度
        let elbowAngle;
        if (isLeft) {
          elbowAngle = 180 - THREE.MathUtils.radToDeg(leftUpperArmVector.angleTo(leftLowerArmVector));
          elbowLeftAngle = elbowAngle;
        } else {
          elbowAngle = 180 - THREE.MathUtils.radToDeg(rightUpperArmVector.angleTo(rightLowerArmVector));
          elbowRightAngle = elbowAngle;
        }
        elbowAngleSpan.textContent = Math.round(elbowAngle);


      }
      // 获取左右臂前后摆角度（度数）
      const leftFrontBack = -parseFloat(leftUpperAngles.z || 0);
      const rightFrontBack = -parseFloat(rightUpperAngles.z || 0);
      const leftLeftRight = -parseFloat(leftUpperAngles.x || 0) + 90;
      const rightLeftRight = -parseFloat(rightUpperAngles.x || 0) + 90;

      // 1. 左手后摆最大值记录逻辑
      if (rightFrontBack < -20 && leftFrontBack > 20) {
        isRecordingLeft = true;
        if (leftFrontBack > leftMaxSwingAngle_temp) {
          leftMaxSwingAngle_temp = leftFrontBack;
        }
      } else if (isRecordingLeft) {
        leftMaxSwingAngle = leftMaxSwingAngle_temp;
        isRecordingLeft = false;
        leftMaxSwingAngle_temp = 0; // 重置临时变量
      }

      // 2. 右手后摆最大值记录逻辑
      if (leftFrontBack < -20 && rightFrontBack > 20) {
        isRecordingRight = true;
        if (rightFrontBack > rightMaxSwingAngle_temp) {
          rightMaxSwingAngle_temp = rightFrontBack;
        }
      } else if (isRecordingRight) {
        rightMaxSwingAngle = rightMaxSwingAngle_temp;
        isRecordingRight = false;
        rightMaxSwingAngle_temp = 0; // 重置临时变量
      }

      // 3. 计算对称性等级
      const angleDifference = Math.abs(leftMaxSwingAngle - rightMaxSwingAngle);
      fbSymmetryLevel = "优";
      if (angleDifference > 30) {
        fbSymmetryLevel = "差";
      } else if (angleDifference > 20) {
        fbSymmetryLevel = "中";
      } else if (angleDifference > 10) {
        fbSymmetryLevel = "良";
      }

      // 4. 更新界面显示
      document.getElementById('frontBackArmSymmetry').textContent = fbSymmetryLevel;
      // 左右摆臂最大值记录逻辑
      // 1. 左手左右摆最大值记录
      if (leftLeftRight > 20 && rightLeftRight < 15) {
        isRecordingLeftLR = true;
        if (leftLeftRight > leftMaxLeftRight_temp) {
          leftMaxLeftRight_temp = leftLeftRight;
        }
      } else if (isRecordingLeftLR) {
        leftMaxLeftRight = leftMaxLeftRight_temp;
        isRecordingLeftLR = false;
        leftMaxLeftRight_temp = 0;
      }

      // 2. 右手左右摆最大值记录
      if (rightLeftRight > 20 && leftLeftRight < 15) {
        isRecordingRightLR = true;
        if (rightLeftRight > rightMaxLeftRight_temp) {
          rightMaxLeftRight_temp = rightLeftRight;
        }
      } else if (isRecordingRightLR) {
        rightMaxLeftRight = rightMaxLeftRight_temp;
        isRecordingRightLR = false;
        rightMaxLeftRight_temp = 0;
      }

      // 计算左右摆臂对称性等级
      const lrAngleDifference = Math.abs(leftMaxLeftRight - rightMaxLeftRight);
      lrSymmetryLevel = "优";
      if (lrAngleDifference > 30) {
        lrSymmetryLevel = "差";
      } else if (lrAngleDifference > 20) {
        lrSymmetryLevel = "中";
      } else if (lrAngleDifference > 10) {
        lrSymmetryLevel = "良";
      }

      // 更新左右摆臂对称性显示
      document.getElementById('leftRightArmSymmetry').textContent = lrSymmetryLevel;


      // 新增：步态状态检测与计数
      const pressureThreshold = 100; // 压力阈值，可根据实际情况调整
      let currentGaitState = null;
      coordinationResult = "差";


      // 1. 判断当前步态状态 (A/B/C/D)
      let currentState;
      if (leftFootPressure > pressureThreshold) {
        if (rightFootPressure > pressureThreshold) {
          currentState = 'C'; // 双脚有压力
        } else {
          currentState = 'A'; // 左脚有压力，右脚无
        }
      } else {
        if (rightFootPressure > pressureThreshold) {
          currentState = 'B'; // 左脚无压力，右脚有
        } else {
          currentState = 'D'; // 双脚无压力
        }
      }

      // 新增：连续C/D状态检测
      if (currentState === 'C') {
        consecutiveCCount++;
        consecutiveDCount = 0;
        if (consecutiveCCount >= 200) {
          coordinationResult = "差";
          consecutiveCCount = 0; // 重置计数器
          stateQueue = []; // 重置队列
        }
      } else if (currentState === 'D') {
        consecutiveDCount++;
        consecutiveCCount = 0;
        if (consecutiveDCount >= 200) {
          coordinationResult = "差";
          consecutiveDCount = 0; // 重置计数器
          stateQueue = []; // 重置队列
        }
      } else {
        consecutiveCCount = 0;
        consecutiveDCount = 0;
      }

      // 2. 循环队列处理 (仅状态变化时入队)
      if (stateQueue.length === 0 || currentState !== stateQueue[stateQueue.length - 1]) {
        stateQueue.push(currentState);
        // 队列满时移除队头元素
        if (stateQueue.length > QUEUE_MAX_LENGTH) {
          stateQueue.shift();
        }
      }

      // 3. 检测A/B是否交替出现
      const filteredStates = stateQueue.filter(s => s === 'A' || s === 'B');
      let isAlternating = true;

      // 检查过滤后的序列是否交替出现A/B
      for (let i = 1; i < filteredStates.length; i++) {
        if (filteredStates[i] === filteredStates[i - 1]) {
          isAlternating = false;
          break;
        }
      }

      // 4. 更新协调性结果 (至少需要2个有效状态才判断为好)
      coordinationResult = (filteredStates.length >= 2 && isAlternating) ? "好" : "差";

      // 5. 更新显示
      const coordinationElement = document.getElementById('armStepCoordination');
      if (coordinationElement) {
        coordinationElement.textContent = coordinationResult;
        // 显示队列状态用于调试 (可选)
        coordinationElement.title = `队列状态: [${stateQueue.join(', ')}]`;
      }
      updateRecommendation();
    }

      }

      if (rightSwingAngle < 7) {
        rightRecommendationString = `右手横向摆臂角度和摆动幅度偏小，建议增加摆角到10°，增加摆幅到${(upperArmLength * THREE.MathUtils.degToRad(10)).toFixed(2)}；`;
      } else if (rightSwingAngle < 20) {
        rightRecommendationString = `右手横向摆臂角度和摆动幅度很好，继续保持；`;
      } else if (rightSwingAngle < 30) {
        rightRecommendationString = `右手横向摆臂角度和摆动幅度偏大，建议减小摆角到15°，减小摆幅到${(upperArmLength * THREE.MathUtils.degToRad(15)).toFixed(2)}；`;
      } else {
        rightRecommendationString = `右手横向摆臂角度和摆动幅度严重偏大，建议尽量缩小横向摆臂角度！；`;
      }

      if (leftRightMagOrAngleRecommendationElement) {
        // 先显示状态信息，再显示建议内容
        leftRightMagOrAngleRecommendationElement.textContent =
          leftStatus + rightStatus + leftRecommendationString + rightRecommendationString;
      }


      //更新前后摆臂对称性的建议
      const frontBackArmSymmetryRecommendationElement = document.getElementById('frontBackArmSymmetryRecommendation');
      if (frontBackArmSymmetryRecommendationElement) {
        if (fbSymmetryLevel === "优") {
          frontBackArmSymmetryRecommendationElement.textContent = "当前前后摆臂的姿势非常好，无需改进";
        }
        else if (fbSymmetryLevel === "良") {
          frontBackArmSymmetryRecommendationElement.textContent = "当前前后摆臂的姿势不是很对称，相差在10度到20度，建议调整摆臂动作做到对称哦，这样才能使摆臂更加经济~";
        }
        else if (fbSymmetryLevel === "中") {
          frontBackArmSymmetryRecommendationElement.textContent = "当前前后摆臂的姿势相差在20度以上，建议调整摆臂动作做到对称哦，这样才能使摆臂更加经济~";
        }
        else {
          frontBackArmSymmetryRecommendationElement.textContent = "当前前后摆臂的姿势相差在20度以上，建议调整摆臂动作做到对称哦，这样才能使摆臂更加经济~";
        }

      }

      //更新左右摆臂对称性的建议
      const leftRightArmSymmetryRecommendationElement = document.getElementById('leftRightArmSymmetryRecommendation');
      if (leftRightArmSymmetryRecommendationElement) {
        if (lrSymmetryLevel === "优") {
          leftRightArmSymmetryRecommendationElement.textContent = "当前左右摆臂的姿势非常好，无需改进";
        } else if (lrSymmetryLevel === "良") {
          leftRightArmSymmetryRecommendationElement.textContent =
            "现在的左右摆臂姿势不是很对称，相差在10度到20度，建议调整摆臂动作做到对称哦，这样才能使摆臂更加经济~";
        } else if (lrSymmetryLevel === "中") {
          leftRightArmSymmetryRecommendationElement.textContent =
            "现在的左右摆臂姿势不太对称，相差在20度到30度，如果保持这么大的偏差的话，会无端浪费很多精力哦~";
        }
        else {
          leftRightArmSymmetryRecommendationElement.textContent =
            "现在的左右摆臂姿势非常不对称，相差在30度以上，再这样跑可能会摔倒啦！";
        }
      }

      //更新协调性的建议
      const recommendationElement = document.getElementById('armStepCoordinationRecommendation');
      if (recommendationElement) {
        if (coordinationResult === "好") {
          recommendationElement.textContent = "当前姿势良好，无需改进";
        } else {
          recommendationElement.textContent = "现在的摆臂频率和步频协调度较差，建议调整摆臂与步频协调哦~";
        }
      }
    }








    // 处理接收到的数据，更新目标旋转（弧度）
    // 处理接收到的数据，更新3D模型并触发波形图更新事件
    function handleMessage(msg) {
      const isRightData = msg.source === 'RIGHT' && Array.isArray(msg.data);
      const isLeftData = msg.source === 'LEFT' && Array.isArray(msg.data);


      if (isRightData || isLeftData) {
        const armData = msg.data.slice(0, 6); // 前6个为手臂数据
        const pressureData = msg.data.slice(6, 24); // 后18个为脚底压力数据
        const armType = isRightData ? 'right' : 'left';


        // 处理大臂数据：弧度（3D模型） + 度数（波形图）
        let upperRad = armData.slice(0, 3).map(deg => THREE.MathUtils.degToRad(deg));
        let upperDeg = armData.slice(0, 3); // 波形图用原始度数（后续修正）

        targetRotations[`${armType}_upper`] = { x: upperRad[0], y: upperRad[1], z: upperRad[2] };
        // 触发波形图更新事件
        document.dispatchEvent(new CustomEvent('jointDataUpdate', {
          detail: { jointKey: `${armType}_upper`, dataArr: upperDeg }
        }));

        // 处理小臂数据：弧度（3D模型） + 度数（波形图）
        let lowerRad = armData.slice(3, 6).map(deg => THREE.MathUtils.degToRad(deg));
        let lowerDeg = armData.slice(3, 6); // 波形图用原始度数（后续修正）

        targetRotations[`${armType}_lower`] = { x: lowerRad[0], y: lowerRad[1], z: lowerRad[2] };
        // 触发波形图更新事件
        document.dispatchEvent(new CustomEvent('jointDataUpdate', {
          detail: { jointKey: `${armType}_lower`, dataArr: lowerDeg }
        }));
        const pressureSum = pressureData.reduce((a, b) => a + b, 0);
        if (armType === 'left') {
          leftFootPressure = pressureSum;
        } else if (armType === 'right') {
          rightFootPressure = pressureSum;
        }
      }
    }

    // 本地BLE桥接WebSocket连接逻辑
    function connectBridgeWebSocket() {
      if (bridgeSocket && bridgeSocket.readyState === WebSocket.OPEN) return;
      if (bridgeSocket && bridgeSocket.readyState === WebSocket.CONNECTING) return;

      clearTimeout(bridgeReconnectTimer);
      bridgeSocket = new WebSocket(BRIDGE_WS_URL);

      bridgeSocket.onopen = () => {
        console.log('BLE桥接器：连接成功');
        bridgeReconnectCount = 0;
      };

      bridgeSocket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'command_result') {
            if (msg.ok) {
              console.log('BLE桥接器：复位命令已下发', msg);
            } else {
              console.warn('BLE桥接器：复位命令下发失败', msg);
            }
            return;
          }
          if (!Array.isArray(msg.data)) return;

          const hand = msg.source || '未知';
          const firstSixData = msg.data.slice(0, 6);
          console.log(`${hand}手桥接数据:`, firstSixData);
          handleMessage(msg);
        } catch (err) {
          console.error('BLE桥接器：解析失败', err, event.data);
        }
      };

      bridgeSocket.onerror = (error) => {
        console.error('BLE桥接器：连接错误', error);
      };

      bridgeSocket.onclose = (event) => {
        if ([1000, 1001].includes(event.code)) return;
        if (bridgeReconnectCount >= MAX_RECONNECT) {
          console.error('BLE桥接器：重连失败');
          return;
        }
        bridgeReconnectCount++;
        bridgeReconnectTimer = setTimeout(connectBridgeWebSocket, 2000);
      };
    }

    // 新增复位按钮点击事件
    document.addEventListener('DOMContentLoaded', function () {
      const resetBtn = document.getElementById('resetDeviceBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', function () {
          if (bridgeSocket && bridgeSocket.readyState === WebSocket.OPEN) {
            bridgeSocket.send(JSON.stringify({ type: 'command', command: 'RESET', target: 'ALL' }));
            console.log('已发送复位命令到BLE桥接器');
          } else {
            console.warn('BLE桥接器未连接，无法发送复位命令');
          }
        });
      }
    });

    function connectWS() {
      connectBridgeWebSocket();
    }

    // 动画循环（每帧更新关节，参考第一份代码的持续渲染）
    function animate() {
      requestAnimationFrame(animate);
      updateJoints(); // 每帧执行平滑过渡
      controls.update();
      renderer.render(scene, camera);
    }

    // 初始化
    initScene();
    loadFBX();
    connectWS();
  </script>
