<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>骨骼调试</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<style>
  body { background:#111; color:#0f0; font:14px monospace; padding:20px; margin:0; }
  pre { white-space:pre-wrap; }
  .info { color:#0ff; }
  .warn { color:#ff0; }
  .err { color:#f44; }
</style>
</head>
<body>
<h2>骨骼层级诊断</h2>
<pre id="output">加载中...</pre>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const out = document.getElementById('output');
function log(msg, cls='') {
  out.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

const loader = new FBXLoader();
loader.load('../rgc-frontend/img/manModule.fbx', model => {
  log('模型加载成功', 'info');
  log(`子物体总数: ${model.children.length}`);
  log('');

  const bones = [];
  model.traverse(child => {
    if (child.isBone) {
      // 计算世界空间位置
      const wp = new THREE.Vector3();
      child.getWorldPosition(wp);

      // 获取相对于父骨骼的方向 (骨骼终点 - 骨骼位置)
      // 骨骼长度 = 到第一个子骨骼的距离，或默认值
      let length = 0.5;
      let direction = new THREE.Vector3(0, -1, 0);

      if (child.children.length > 0) {
        const childWp = new THREE.Vector3();
        child.children[0].getWorldPosition(childWp);
        direction.copy(childWp).sub(wp);
        length = direction.length();
        direction.normalize();
      }

      // 局部旋转（欧拉角，度）
      const euler = new THREE.Euler().setFromQuaternion(child.quaternion, 'XYZ');

      bones.push({
        name: child.name,
        worldPos: wp,
        direction: direction.clone(),
        length: length,
        localRot: {
          x: THREE.MathUtils.radToDeg(euler.x).toFixed(1),
          y: THREE.MathUtils.radToDeg(euler.y).toFixed(1),
          z: THREE.MathUtils.radToDeg(euler.z).toFixed(1),
        },
        parentName: child.parent && child.parent.isBone ? child.parent.name : '(root)',
        children: child.children.filter(c => c.isBone).map(c => c.name)
      });
    }
  });

  // 按 Y 坐标排序显示（从上到下，方便看层级）
  bones.sort((a, b) => b.worldPos.y - a.worldPos.y);

  log('骨骼列表 (按Y坐标从上到下):', 'info');
  log('─'.repeat(80));
  for (const b of bones) {
    const dirLabel = `朝向:(${b.direction.x.toFixed(2)}, ${b.direction.y.toFixed(2)}, ${b.direction.z.toFixed(2)})`;
    log(`${b.name.padEnd(28)} | 位置:(${b.worldPos.x.toFixed(2)},${b.worldPos.y.toFixed(2)},${b.worldPos.z.toFixed(2)}) | ${dirLabel} | 长=${b.length.toFixed(2)} | 局部旋转(${b.localRot.x},${b.localRot.y},${b.localRot.z})° | 父:${b.parentName}`,
      b.name.includes('Head') ? 'warn' : '');
  }

  log('\n骨骼层级树:', 'info');
  log('─'.repeat(80));

  function printTree(bone, indent=0) {
    const name = bone.name || '(unnamed)';
    const wp = new THREE.Vector3();
    bone.getWorldPosition(wp);
    log('  '.repeat(indent) + `├─ ${name} @ (${wp.x.toFixed(2)},${wp.y.toFixed(2)},${wp.z.toFixed(2)})`);
    bone.children.filter(c => c.isBone).forEach(c => printTree(c, indent + 1));
  }

  // 找根骨骼
  const rootBones = model.children.filter(c => c.isBone);
  if (rootBones.length > 0) {
    rootBones.forEach(rb => printTree(rb));
  } else {
    // 尝试找 hips
    model.traverse(child => {
      if (child.isBone && child.name.includes('Hips')) {
        printTree(child);
      }
    });
  }

}, undefined, err => {
  log(`加载失败: ${err}`, 'err');
});
</script>
</body>
</html>
